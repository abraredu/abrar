<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ABRAR Management System</title>
    <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="logo.png" alt="ABRAR Logo" style="height: 64px; width: auto; margin: 0 auto;">
      </div>
      <div class="auth-subtitle">Madrasa Management System</div>
      
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email" class="form-label">Username or Email</label>
          <input type="text" id="email" class="form-control" required placeholder="admin@abrar.com or tutor username">
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
      
      <div style="margin-top: 1rem; font-size: 0.875rem;">
        <a href="#" class="text-muted">Forgot Password?</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
