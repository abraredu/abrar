<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Manual Income - ABRAR Management System</title>
    <link rel="icon" type="image/png" href="../icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    
    <aside class="sidebar" id="sidebar">
      <!-- Standard sidebar omitted for brevity, assuming layout works as usual -->
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="../logo.png" alt="ABRAR Logo" style="height: 32px; width: auto;">
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="../dashboard.html" class="nav-item">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="../students/students.html" class="nav-item">
          <i data-lucide="users"></i> Students
        </a>
        <a href="../courses/classes.html" class="nav-item">
          <i data-lucide="library"></i> Courses
        </a>
        <a href="../tutors/tutors.html" class="nav-item">
          <i data-lucide="graduation-cap"></i> Tutors
        </a>
        <a href="../tutors/salary-control.html" class="nav-item" style="padding-left: 2.5rem; font-size: 0.875rem;">
          Salary Control
        </a>
        <a href="accounts.html" class="nav-item active">
          <i data-lucide="wallet"></i> Finance
        </a>
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i data-lucide="menu"></i>
          </button>
          <div>
            <div style="font-size: 0.875rem; color: var(--color-text-secondary); margin-bottom: 0.25rem;">
              <a href="accounts.html" style="color: inherit;">Accounts</a> / Add Income
            </div>
            <h1 class="page-title text-success">Add Manual Income</h1>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div class="card" style="max-width: 600px;">
          <form id="incomeForm">
            <div class="form-group">
              <label class="form-label">Date *</label>
              <input type="date" id="date" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Category *</label>
              <select id="category" class="form-control" required>
                <option value="">Select Category</option>
                <option value="Donation">Donation</option>
                <option value="Admission Fee">Admission Fee</option>
                <option value="Investment">Investment</option>
                <option value="Other Income">Other Income</option>
              </select>
            </div>
            
            <div id="admissionFields" style="display: none; background: #F9FAFB; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--color-border);">
              <div class="form-group">
                <label class="form-label">Student ID *</label>
                <input type="text" id="studentId" class="form-control" placeholder="e.g. ABR001">
              </div>
              
              <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                <input type="checkbox" id="isHomeMember" style="width: auto;">
                <label for="isHomeMember" class="form-label" style="margin: 0; cursor: pointer;">Home Member (Add multiple students)</label>
              </div>
              
              <div class="form-group" id="additionalStudentsGroup" style="display: none;">
                <label class="form-label">Additional Student IDs</label>
                <div id="additionalStudentsList" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem;">
                  <!-- Dynamic inputs will be added here -->
                  <div style="display: flex; gap: 0.5rem;">
                    <input type="text" class="form-control additional-student-id" placeholder="e.g. ABR002">
                  </div>
                </div>
                <button type="button" id="addStudentBtn" class="btn btn-outline" style="font-size: 0.875rem; padding: 0.35rem 0.75rem;">+ Add Another Student</button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Description *</label>
              <input type="text" id="description" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Amount (₹) *</label>
              <input type="number" id="amount" class="form-control" required min="1" step="0.01">
            </div>
            <div class="form-group">
              <label class="form-label">Payment Method *</label>
              <select id="paymentMethod" class="form-control" required>
                <option value="Cash">Cash</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="UPI">UPI</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Reference Number</label>
              <input type="text" id="reference" class="form-control">
            </div>
            
            <div style="display: flex; gap: 1rem; justify-content: flex-end; border-top: 1px solid var(--color-border); padding-top: 1.5rem; margin-top: 1.5rem;">
              <a href="accounts.html" class="btn btn-outline">Cancel</a>
              <button type="submit" class="btn btn-primary" id="submitBtn">Save Income</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>lucide.createIcons();</script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/layout.js"></script>
  <script type="module" src="../js/income.js"></script>
</body>
</html>
