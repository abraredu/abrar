<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Student - ABRAR Management System</title>
    <link rel="icon" type="image/png" href="../icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="../logo.png" alt="ABRAR Logo" style="height: 32px; width: auto;">
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="../dashboard.html" class="nav-item">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="../students/students.html" class="nav-item active">
          <i data-lucide="users"></i> Students
        </a>
        <a href="../courses/classes.html" class="nav-item">
          <i data-lucide="library"></i> Courses
        </a>
        <a href="../tutors/tutors.html" class="nav-item">
          <i data-lucide="graduation-cap"></i> Tutors
        </a>
        <a href="../finance/accounts.html" class="nav-item">
          <i data-lucide="wallet"></i> Finance
        </a>
          <a href="../reports/progress.html" class="nav-item">
            <i data-lucide="line-chart"></i> Progress
          </a>
        <a href="../reports/reports.html" class="nav-item">
          <i data-lucide="bar-chart-3"></i> Reports
        </a>
        <a href="../notifications/notifications.html" class="nav-item">
          <i data-lucide="bell"></i> Notifications
        </a>
        <a href="../messages/messages.html" class="nav-item">
          <i data-lucide="mail"></i> Messages
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <a href="../settings.html" class="nav-item">
          <i data-lucide="settings"></i> Settings
        </a>
        <a href="#" id="logoutBtn" class="nav-item text-danger">
          <i data-lucide="log-out"></i> Logout
        </a>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i data-lucide="menu"></i>
          </button>
          <div>
            <div style="font-size: 0.875rem; color: var(--color-text-secondary); margin-bottom: 0.25rem;">
              <a href="students.html" style="color: inherit;">Students</a> / Edit Student
            </div>
            <h1 class="page-title" id="pageTitle">Edit Student</h1>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div class="card" style="max-width: 800px;">
          <form id="editStudentForm">
            
            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">Personal Information</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">Student Name *</label>
                <input type="text" id="name" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Parent Name *</label>
                <input type="text" id="parentName" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Phone *</label>
                <input type="tel" id="phone" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">WhatsApp</label>
                <input type="tel" id="whatsapp" class="form-control">
              </div>
              <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Place/Address</label>
                <input type="text" id="place" class="form-control">
              </div>
            </div>

            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">Academic Information</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">Course Type *</label>
                <select id="courseType" class="form-control" required>
                  <option value="">Select Course</option>
                  <option value="madrasa_group">Madrasa Group</option>
                  <option value="madrasa_individual">Madrasa Individual</option>
                  <option value="quran_recitation">Qur'an Recitation</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Tutor</label>
                <select id="tutorId" class="form-control">
                  <option value="">Select Tutor</option>
                </select>
              </div>
              <div class="form-group" id="classGroup" style="display: none;">
                <label class="form-label">Group Class *</label>
                <select id="classId" class="form-control">
                  <option value="">Select Class</option>
                </select>
              </div>
              <div class="form-group" id="levelGroup" style="display: none;">
                <label class="form-label">Level</label>
                <input type="text" id="level" class="form-control" placeholder="e.g. 1, 2, Beginner">
              </div>
              <div class="form-group">
                <label class="form-label">Admission Date *</label>
                <input type="date" id="admissionDate" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Class Starting Date</label>
                <input type="date" id="classStartingDate" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label">Monthly Fee (₹) *</label>
                <input type="number" id="monthlyFee" class="form-control" required min="0" step="0.01">
              </div>
            </div>
            
            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">Account Status</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
               <div class="form-group">
                <label class="form-label">Status *</label>
                <select id="status" class="form-control" required>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                  <option value="completed">Completed</option>
                  <option value="suspended">Suspended</option>
                </select>
              </div>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: space-between; border-top: 1px solid var(--color-border); padding-top: 1.5rem;">
              <button type="button" class="btn btn-outline text-danger" id="deleteBtn" style="border-color: var(--color-danger);">Delete Student</button>
              <div style="display: flex; gap: 1rem;">
                <a href="students.html" class="btn btn-outline" id="cancelBtn">Cancel</a>
                <button type="submit" class="btn btn-primary" id="submitBtn">Update Student</button>
              </div>
            </div>
            
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>lucide.createIcons();</script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/layout.js"></script>
  <script type="module" src="../js/edit-student.js"></script>
</body>
</html>
