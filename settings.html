<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - ABRAR Management System</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="logo.png" alt="ABRAR Logo" style="height: 32px; width: auto;">
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="students/students.html" class="nav-item">
          <i data-lucide="users"></i> Students
        </a>
        <div class="submenu">
          <a href="students/admission.html" class="submenu-item">Admission</a>
        </div>
        <a href="courses/classes.html" class="nav-item">
          <i data-lucide="library"></i> Courses
        </a>
        <div class="submenu">
          <a href="courses/manage.html" class="submenu-item">Manage</a>
          <a href="courses/upgrade.html" class="submenu-item">Upgrade</a>
        </div>
        <a href="tutors/tutors.html" class="nav-item">
          <i data-lucide="graduation-cap"></i> Tutors
        </a>
        <a href="finance/accounts.html" class="nav-item">
          <i data-lucide="wallet"></i> Finance
        </a>
        <div class="submenu">
          <a href="finance/fees.html" class="submenu-item">Fees</a>
          <a href="finance/salaries.html" class="submenu-item">Salary</a>
          <a href="finance/accounts.html" class="submenu-item">Account</a>
        </div>
          <a href="reports/progress.html" class="nav-item">
            <i data-lucide="line-chart"></i> Progress
          </a>
        <div class="submenu">
          <a href="reports/data.html" class="submenu-item">Data</a>
        </div>
        
        <a href="assessments/assessments.html" class="nav-item">
          <i data-lucide="clipboard-check"></i> Assessments
        </a>
        <a href="reports/reports.html" class="nav-item">
          <i data-lucide="bar-chart-3"></i> Reports
        </a>
        <a href="notifications/notifications.html" class="nav-item">
          <i data-lucide="bell"></i> Notifications
        </a>
        <a href="messages/messages.html" class="nav-item">
          <i data-lucide="mail"></i> Messages
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <a href="settings.html" class="nav-item active">
          <i data-lucide="settings"></i> Settings
        </a>
        <a href="#" id="logoutBtn" class="nav-item text-danger">
          <i data-lucide="log-out"></i> Logout
        </a>
      </div>
    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="page-title">Settings</h1>
        </div>
        
        <div class="header-right">
          <div class="user-profile">
            <span id="userName" class="text-sm font-medium">Loading...</span>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
          <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Profile Settings</h2>
          <form id="settingsForm">
            <div class="form-group" style="margin-bottom: 1rem;">
              <label class="form-label" for="displayName">Display Name</label>
              <input type="text" id="displayName" class="form-control" placeholder="Admin User">
            </div>
            
            <div class="form-group" style="margin-bottom: 1rem;">
              <label class="form-label" for="emailAddress">Email Address</label>
              <input type="email" id="emailAddress" class="form-control" placeholder="admin@abrar.com" disabled>
              <small style="color: var(--color-text-secondary); display: block; margin-top: 0.5rem;">Email address cannot be changed.</small>
            </div>
            
            <div class="form-group" style="margin-bottom: 1.5rem;">
              <label class="form-label" for="newPassword">New Password</label>
              <input type="password" id="newPassword" class="form-control" placeholder="Leave blank to keep current">
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 1rem;">
              <button type="button" class="btn btn-outline" onclick="window.history.back()">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/toast.js"></script>
  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('emailAddress').value = user.email || '';
        document.getElementById('displayName').value = user.displayName || 'Admin User';
      }
    });

    document.getElementById('settingsForm').addEventListener('submit', (e) => {
      e.preventDefault();
      // Use the global toast object from js/toast.js
      if (window.toast) {
        window.toast.success('Settings saved successfully!');
      } else {
        alert('Settings saved successfully!');
      }
    });
  </script>
</body>
</html>
