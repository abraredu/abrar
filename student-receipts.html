<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipts - Student Portal</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html2canvas + jsPDF for downloading receipt as PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .receipt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(550px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    
    .receipt-card {
      background: white;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      position: relative;
      color: var(--color-text);
      border-radius: 12px;
      overflow: hidden;
    }

    .receipt-header {
      text-align: center;
      border-bottom: 2px dashed #d1d5db;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }
    
    .receipt-header h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: bold;
    }
    
    .receipt-header p {
      margin: 0.25rem 0 0 0;
      font-size: 0.875rem;
      color: #4b5563;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }
    
    .receipt-total {
      border-top: 2px dashed #d1d5db;
      padding-top: 1rem;
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 1.125rem;
    }

    .receipt-footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #6b7280;
    }

    .download-btn {
      width: 100%;
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="logo.png" alt="ABRAR Logo" style="height: 32px; width: auto;">
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="student-dashboard.html" class="nav-item">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="student-progress.html" class="nav-item">
          <i data-lucide="line-chart"></i> Progress of Month
        </a>
        <a href="student-receipts.html" class="nav-item active">
          <i data-lucide="receipt"></i> Receipts
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <a href="#" id="logoutBtn" class="nav-item text-danger">
          <i data-lucide="log-out"></i> Logout
        </a>
      </div>
    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i data-lucide="menu"></i>
          </button>
          <h2>My Receipts</h2>
        </div>
        
        <div class="header-right">
          <div class="user-profile" style="display: flex; align-items: center; gap: 0.5rem;">
            <img src="https://ui-avatars.com/api/?name=Student&background=random" alt="Profile" id="headerAvatar" style="width: 32px; height: 32px; border-radius: 50%;">
            <span id="headerName" class="text-sm font-medium">Student</span>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content">
        <div id="receiptsContainer" class="receipt-grid">
          <p style="color: var(--color-text-secondary); padding: 1rem;">Loading receipts...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();
    
    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    
    if (mobileMenuBtn && sidebar && overlay) {
      mobileMenuBtn.addEventListener('click', () => {
        sidebar.classList.add('active');
        overlay.classList.add('active');
      });
      
      overlay.addEventListener('click', () => {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
      });
    }
  </script>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/student-receipts.js"></script>
</body>
</html>
