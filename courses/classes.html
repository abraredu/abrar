<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Classes - ABRAR Management System</title>
    <link rel="icon" type="image/png" href="../icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="../logo.png" alt="ABRAR Logo" style="height: 32px; width: auto;">
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="../dashboard.html" class="nav-item">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="../students/students.html" class="nav-item">
          <i data-lucide="users"></i> Students
        </a>
        <a href="../courses/classes.html" class="nav-item active">
          <i data-lucide="library"></i> Courses
        </a>
        <a href="../tutors/tutors.html" class="nav-item">
          <i data-lucide="graduation-cap"></i> Tutors
        </a>
        <a href="../finance/accounts.html" class="nav-item">
          <i data-lucide="wallet"></i> Finance
        </a>
          <a href="../reports/progress.html" class="nav-item">
            <i data-lucide="line-chart"></i> Progress
          </a>
        <a href="../reports/reports.html" class="nav-item">
          <i data-lucide="bar-chart-3"></i> Reports
        </a>
        <a href="../notifications/notifications.html" class="nav-item">
          <i data-lucide="bell"></i> Notifications
        </a>
        <a href="../messages/messages.html" class="nav-item">
          <i data-lucide="mail"></i> Messages
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <a href="../settings.html" class="nav-item">
          <i data-lucide="settings"></i> Settings
        </a>
        <a href="#" id="logoutBtn" class="nav-item text-danger">
          <i data-lucide="log-out"></i> Logout
        </a>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="top-header" style="border-bottom: none; padding-bottom: 0;">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="page-title" style="font-size: 1.75rem; color: #111827;">Course Management</h1>
        </div>
        <div class="header-right">
          <button class="btn btn-primary" id="addClassBtn" style="background: linear-gradient(135deg, var(--color-primary), var(--color-accent)); box-shadow: 0 4px 12px rgba(8, 122, 66, 0.2); border: none;">
            <i data-lucide="plus"></i> Add Class
          </button>
        </div>
      </header>

      <div class="page-content" style="padding-top: 1rem;">
        
        <!-- Premium Course Sub-Navigation as Tabs -->
        <div class="course-tabs" style="display: flex; gap: 0.5rem; margin-bottom: 1rem; background: #ffffff; padding: 0.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); width: fit-content; border: 1px solid var(--color-border);">
          <button data-tab="one-to-one" class="btn btn-outline tab-btn" style="border: none; border-radius: var(--radius-md); padding: 0.5rem 1.25rem;">One-to-One</button>
          <button data-tab="quran" class="btn btn-outline tab-btn" style="border: none; border-radius: var(--radius-md); padding: 0.5rem 1.25rem;">Qur'an</button>
          <button data-tab="group" class="btn btn-primary tab-btn active" style="border-radius: var(--radius-md); padding: 0.5rem 1.25rem; background: #e6f4ea; color: var(--color-primary); box-shadow: none;">Group Tuition</button>
        </div>

        <!-- Dynamic Class Secondary Tabs (Only for Group Tuition) -->
        <div id="groupClassTabsContainer" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--color-border); overflow-x: auto; padding-bottom: 0.25rem;">
          <!-- Tabs injected by JS -->
        </div>

        <!-- Premium Stat Cards -->
        <div class="stats-grid" style="margin-bottom: 2rem;">
          <div class="card stat-card" style="border: 1px solid #f3f4f6; box-shadow: 0 4px 15px rgba(0,0,0,0.03); background: linear-gradient(to right bottom, #ffffff, #f9fafb); padding: 1.25rem; border-radius: 1rem;">
            <div class="stat-icon" style="background: rgba(8, 122, 66, 0.1); color: var(--color-primary); width: 56px; height: 56px;">
              <i data-lucide="library" id="statIconTotal" style="width: 28px; height: 28px;"></i>
            </div>
            <div class="stat-info">
              <span class="stat-title" id="statTitleTotal" style="font-size: 0.9rem;">Total Classes</span>
              <span class="stat-value" id="statTotalClasses">-</span>
            </div>
          </div>
          <div class="card stat-card" style="border: 1px solid #f3f4f6; box-shadow: 0 4px 15px rgba(0,0,0,0.03); background: linear-gradient(to right bottom, #ffffff, #f9fafb); padding: 1.25rem; border-radius: 1rem;">
            <div class="stat-icon" style="background: rgba(22, 163, 74, 0.1); color: var(--color-success); width: 56px; height: 56px;">
              <i data-lucide="check-circle" id="statIconActive" style="width: 28px; height: 28px;"></i>
            </div>
            <div class="stat-info">
              <span class="stat-title" id="statTitleActive" style="font-size: 0.9rem;">Active Classes</span>
              <span class="stat-value" id="statActiveClasses">-</span>
            </div>
          </div>
        </div>

        <!-- Premium Table Card -->
        <div class="card" style="border: 1px solid #e5e7eb; box-shadow: 0 4px 20px rgba(0,0,0,0.04); overflow: hidden; padding: 0; border-radius: 1rem;">
          <div style="padding: 1.5rem; border-bottom: 1px solid var(--color-border); background: #ffffff;">
            <h2 id="tableTitle" style="font-size: 1.25rem; font-weight: 600; color: #1f2937;">Manage Group Tuition</h2>
            <p id="tableDesc" class="text-muted" style="font-size: 0.875rem; margin-top: 0.25rem;">Create and manage batches, assign tutors, and set schedules.</p>
          </div>
          <div style="overflow-x: auto;">
            <div class="table-responsive">
<table style="width: 100%; text-align: left; border-collapse: collapse; min-width: 900px; background: #ffffff;">
              <thead id="tableHeader">
                <!-- Dynamically injected -->
              </thead>
              <tbody id="classesTableBody">
                <tr><td colspan="7" style="text-align: center; padding: 3rem; color: #64748b;">
                  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;">
                    <i data-lucide="loader-2" style="animation: spin 1s linear infinite; width: 32px; height: 32px; color: var(--color-primary);"></i>
                    <p style="font-weight: 500;">Loading...</p>
                  </div>
                </td></tr>
              </tbody>
            </table>
</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Class Modal (Hidden by default) -->
  <div id="classModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 500px; margin: 1rem; position: relative;">
      <h2 id="modalTitle" style="margin-bottom: 1.5rem;">Add Class</h2>
      <form id="classForm">
        <input type="hidden" id="classId">
        <div class="form-group">
          <label class="form-label">Class Name * (e.g. Batch A)</label>
          <input type="text" id="className" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Level * (e.g. Class 1)</label>
          <input type="text" id="classLevel" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Tutor (Optional)</label>
          <select id="classTutor" class="form-control">
             <option value="">Select Tutor</option>
             <!-- Load dynamic later -->
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Schedule (e.g. Mon-Wed 5PM)</label>
          <input type="text" id="schedule" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Default Monthly Fee (₹)</label>
          <input type="number" id="defaultFee" class="form-control" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">Status *</label>
          <select id="classStatus" class="form-control" required>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-outline" id="closeModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveClassBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>lucide.createIcons();</script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/layout.js"></script>
  <script type="module" src="../js/classes.js"></script>
</body>
</html>
