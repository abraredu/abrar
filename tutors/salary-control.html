<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salary Control - ABRAR Management System</title>
    <link rel="icon" type="image/png" href="../icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="../logo.png" alt="ABRAR Logo" style="height: 32px; width: auto;">
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="../dashboard.html" class="nav-item">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="../students/students.html" class="nav-item">
          <i data-lucide="users"></i> Students
        </a>
        <a href="../courses/classes.html" class="nav-item">
          <i data-lucide="library"></i> Courses
        </a>
        <a href="tutors.html" class="nav-item active">
          <i data-lucide="graduation-cap"></i> Tutors
        </a>
        <a href="salary-control.html" class="nav-item" style="padding-left: 2.5rem; font-size: 0.875rem;">
          Salary Control
        </a>
        <a href="../finance/accounts.html" class="nav-item">
          <i data-lucide="wallet"></i> Finance
        </a>
        <a href="../reports/reports.html" class="nav-item">
          <i data-lucide="bar-chart-3"></i> Reports
        </a>
        <a href="../notifications/notifications.html" class="nav-item">
          <i data-lucide="bell"></i> Notifications
        </a>
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="page-title">Salary Control</h1>
        </div>
      </header>

      <div class="page-content">
        <!-- Month Selector & Tutor Selection -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div class="form-group" style="margin-bottom: 0; flex: 1;">
              <label class="form-label">Select Month</label>
              <input type="month" id="monthSelector" class="form-control">
            </div>
            <div class="form-group" style="margin-bottom: 0; flex: 2;">
              <label class="form-label">Select Tutor</label>
              <select id="tutorSelector" class="form-control">
                <option value="">-- Select a Tutor --</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Dynamic Tabs Container (Hidden by default) -->
        <div class="card" id="tutorRolesContainer" style="display: none; margin-bottom: 1.5rem;">
          <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;" id="selectedTutorNameDisplay">Tutor Roles</h3>
          
          <!-- Tabs Navigation -->
          <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem; overflow-x: auto;" id="tabsNav">
            <!-- Tabs injected here -->
          </div>
          
          <!-- Tabs Content -->
          <div id="tabsContent">
            <!-- Content injected here -->
          </div>
        </div>
        
        <!-- Table of Saved Configurations -->
        <div class="card" style="overflow-x: auto;">
          <h3 style="margin-bottom: 1rem; padding-bottom: 0.5rem;">Saved Entries (<span id="currentMonthDisplay"></span>)</h3>
          <table style="width: 100%; text-align: left; border-collapse: collapse;">
            <thead>
              <tr style="border-bottom: 1px solid var(--color-border);">
                <th style="padding: 0.75rem; font-weight: 600; color: var(--color-text-secondary);">Tutor Name</th>
                <th style="padding: 0.75rem; font-weight: 600; color: var(--color-text-secondary);">Role / Type</th>
                <th style="padding: 0.75rem; font-weight: 600; color: var(--color-text-secondary);">Salary Type</th>
                <th style="padding: 0.75rem; font-weight: 600; color: var(--color-text-secondary);">Amount (₹)</th>
                <th style="padding: 0.75rem; font-weight: 600; color: var(--color-text-secondary);">Date</th>
                <th style="padding: 0.75rem; font-weight: 600; color: var(--color-text-secondary);">Action</th>
              </tr>
            </thead>
            <tbody id="savedEntriesTableBody">
              <tr><td colspan="6" style="text-align: center; padding: 2rem;">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Salary Modal -->
  <div id="salaryModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 500px; margin: 1rem; position: relative;">
      <h2 style="margin-bottom: 1.5rem;">Pay Salary</h2>
      <form id="salaryForm">
        <input type="hidden" id="payTutorId">
        
        <div style="background: var(--color-background); padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem;">
          <div style="font-weight: 600;" id="payTutorName">-</div>
          <div style="font-size: 0.875rem; color: var(--color-text-secondary);" id="payTutorIdDisplay">-</div>
          
          <div style="margin-top: 1rem; font-size: 0.875rem;">
            Calculated Amount: <strong id="payCalculated">₹0</strong>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Adjustment (₹) (Use negative for deductions)</label>
          <input type="number" id="payAdjustment" class="form-control" value="0" step="0.01">
        </div>

        <div style="background: var(--color-sidebar-active); padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; color: var(--color-sidebar-active-text);">
          Final Amount: <strong id="payFinalAmount" style="font-size: 1.125rem;">₹0</strong>
        </div>

        <div class="form-group">
          <label class="form-label">Payment Amount (₹) *</label>
          <input type="number" id="payAmount" class="form-control" required min="1" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">Payment Method *</label>
          <select id="payMethod" class="form-control" required>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Payment Date *</label>
          <input type="date" id="payDateModal" class="form-control" required>
        </div>
        
        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-outline" id="closeSalaryModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveSalaryBtn">Confirm Payment</button>
        </div>
      </form>
    </div>
  </div>

  <script>lucide.createIcons();</script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/layout.js"></script>
  <script type="module" src="../js/salary-control.js"></script>
</body>
</html>
