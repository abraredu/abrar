<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Tutor - ABRAR Management System</title>
  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="app-container">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="../logo.png" alt="ABRAR Logo" style="height: 32px; width: auto;">
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="../dashboard.html" class="nav-item">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="../students/students.html" class="nav-item">
          <i data-lucide="users"></i> Students
        </a>
        <a href="../courses/classes.html" class="nav-item">
          <i data-lucide="library"></i> Courses
        </a>
        <a href="tutors.html" class="nav-item active">
          <i data-lucide="graduation-cap"></i> Tutors
        </a>
        <a href="salary-control.html" class="nav-item" style="padding-left: 2.5rem; font-size: 0.875rem;">
          Salary Control
        </a>
        <a href="../finance/accounts.html" class="nav-item">
          <i data-lucide="wallet"></i> Finance
        </a>
        <a href="../reports/reports.html" class="nav-item">
          <i data-lucide="bar-chart-3"></i> Reports
        </a>
        <a href="../notifications/notifications.html" class="nav-item">
          <i data-lucide="bell"></i> Notifications
        </a>
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i data-lucide="menu"></i>
          </button>
          <div>
            <div style="font-size: 0.875rem; color: var(--color-text-secondary); margin-bottom: 0.25rem;">
              <a href="tutors.html" style="color: inherit;">Tutors</a> / Edit Tutor
            </div>
            <h1 class="page-title" id="pageTitle">Edit Tutor</h1>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div class="card" style="max-width: 800px;">
          <form id="editTutorForm">

            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
              Personal Information</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">Tutor Name *</label>
                <input type="text" id="name" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Phone *</label>
                <input type="tel" id="phone" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">WhatsApp</label>
                <input type="tel" id="whatsapp" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control">
              </div>
              <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Address</label>
                <input type="text" id="address" class="form-control">
              </div>
            </div>

            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
              Employment Details</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">Tutor Type *</label>
                <div id="tutorTypeCheckboxes"
                  style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
                  <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer;">
                    <input type="checkbox" name="tutorType" value="madrasa_individual" class="tutor-type-checkbox">
                    Madrasa Individual
                  </label>
                  <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer;">
                    <input type="checkbox" name="tutorType" value="madrasa_group" class="tutor-type-checkbox"> Madrasa
                    Group
                  </label>
                  <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer;">
                    <input type="checkbox" name="tutorType" value="quran_recitation" class="tutor-type-checkbox"> Qur'an
                    Recitation
                  </label>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Joining Date *</label>
                <input type="date" id="joiningDate" class="form-control" required>
              </div>

            </div>

            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">Login
              Credentials (Optional)</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">Login Username</label>
                <input type="text" id="loginUsername" class="form-control" placeholder="Enter username for tutor">
              </div>
              <div class="form-group">
                <label class="form-label">Login Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter password for tutor">
              </div>
            </div>

            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
              Account Status</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">Status *</label>
                <select id="status" class="form-control" required>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div
              style="display: flex; gap: 1rem; justify-content: space-between; border-top: 1px solid var(--color-border); padding-top: 1.5rem;">
              <button type="button" class="btn btn-outline text-danger" id="deleteBtn"
                style="border-color: var(--color-danger);">Delete Tutor</button>
              <div style="display: flex; gap: 1rem;">
                <a href="tutors.html" class="btn btn-outline" id="cancelBtn">Cancel</a>
                <button type="submit" class="btn btn-primary" id="submitBtn">Update Tutor</button>
              </div>
            </div>

          </form>
        </div>
      </div>
    </main>
  </div>

  <script>lucide.createIcons();</script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/layout.js"></script>
  <script type="module" src="../js/edit-tutor.js"></script>
</body>

</html>
