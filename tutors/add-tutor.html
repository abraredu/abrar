<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Tutor - ABRAR Management System</title>
  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="app-container">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="../logo.png" alt="ABRAR Logo" style="height: 32px; width: auto;">
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="../dashboard.html" class="nav-item">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="../students/students.html" class="nav-item">
          <i data-lucide="users"></i> Students
        </a>
        <a href="../courses/classes.html" class="nav-item">
          <i data-lucide="library"></i> Courses
        </a>
        <a href="../tutors/tutors.html" class="nav-item active">
          <i data-lucide="graduation-cap"></i> Tutors
        </a>
        <a href="../finance/accounts.html" class="nav-item">
          <i data-lucide="wallet"></i> Finance
        </a>
          <a href="../reports/progress.html" class="nav-item">
            <i data-lucide="line-chart"></i> Progress
          </a>
        <a href="../reports/reports.html" class="nav-item">
          <i data-lucide="bar-chart-3"></i> Reports
        </a>
        <a href="../notifications/notifications.html" class="nav-item">
          <i data-lucide="bell"></i> Notifications
        </a>
        <a href="../messages/messages.html" class="nav-item">
          <i data-lucide="mail"></i> Messages
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <a href="../settings.html" class="nav-item">
          <i data-lucide="settings"></i> Settings
        </a>
        <a href="#" id="logoutBtn" class="nav-item text-danger">
          <i data-lucide="log-out"></i> Logout
        </a>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i data-lucide="menu"></i>
          </button>
          <div>
            <div style="font-size: 0.875rem; color: var(--color-text-secondary); margin-bottom: 0.25rem;">
              <a href="tutors.html" style="color: inherit;">Tutors</a> / Add Tutor
            </div>
            <h1 class="page-title">Add Tutor</h1>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div class="card" style="max-width: 800px;">
          <form id="addTutorForm">

            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
              Personal Information</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">Tutor Name *</label>
                <input type="text" id="name" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Phone *</label>
                <input type="tel" id="phone" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">WhatsApp</label>
                <input type="tel" id="whatsapp" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control">
              </div>
              <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Address</label>
                <input type="text" id="address" class="form-control">
              </div>
            </div>

            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
              Employment Details</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">Tutor Type *</label>
                <div id="tutorTypeCheckboxes"
                  style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
                  <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer;">
                    <input type="checkbox" name="tutorType" value="madrasa_individual" class="tutor-type-checkbox">
                    Madrasa Individual
                  </label>
                  <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer;">
                    <input type="checkbox" name="tutorType" value="madrasa_group" class="tutor-type-checkbox"> Madrasa
                    Group
                  </label>
                  <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer;">
                    <input type="checkbox" name="tutorType" value="quran_recitation" class="tutor-type-checkbox"> Qur'an
                    Recitation
                  </label>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Joining Date *</label>
                <input type="date" id="joiningDate" class="form-control" required>
              </div>

            </div>

            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">Login
              Credentials (Optional)</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">userId</label>
                <input type="text" id="loginUsername" class="form-control" placeholder="Enter userId (defaults to Tutor ID)">
              </div>
              <div class="form-group">
                <label class="form-label">Login Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter password for tutor">
              </div>
            </div>

            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">
              Documents & Photo</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">Profile Photo (Optional)</label>
                <input type="file" id="photo" class="form-control" accept="image/*">
                <div style="font-size: 0.75rem; color: var(--color-text-secondary); margin-top: 0.25rem;">Max 5MB. Jpg,
                  Png.</div>
              </div>
              <div class="form-group">
                <label class="form-label">ID Document / Aadhaar (Optional)</label>
                <input type="file" id="idDocument" class="form-control" accept="image/*,.pdf">
                <div style="font-size: 0.75rem; color: var(--color-text-secondary); margin-top: 0.25rem;">Max 5MB. PDF
                  or Image.</div>
              </div>
            </div>

            <div
              style="display: flex; gap: 1rem; justify-content: flex-end; border-top: 1px solid var(--color-border); padding-top: 1.5rem;">
              <a href="tutors.html" class="btn btn-outline">Cancel</a>
              <button type="submit" class="btn btn-primary" id="submitBtn">Save Tutor</button>
            </div>

          </form>
        </div>
      </div>
    </main>
  </div>

  <script>lucide.createIcons();</script>
  <script type="module" src="../js/cloudinary-config.js"></script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/layout.js"></script>
  <script type="module" src="../js/add-tutor.js"></script>
</body>

</html>
